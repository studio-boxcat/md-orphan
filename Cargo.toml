[package]
name = "md-orphan"
version = "0.1.0"
edition = "2024"

[lib]
name = "md_orphan"
path = "src/lib.rs"

[[bin]]
name = "md-orphan"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"   # typed error variants for ConfigError matching
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ignore = "0.4"      # parallel walker (work-stealing thread pool); same crate fd/ripgrep use
tempfile = "3"
unicode-segmentation = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
